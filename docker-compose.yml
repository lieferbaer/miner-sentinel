version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: minersentinel-postgres
    restart: unless-stopped
    env_file: ".env"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - minersentinel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minersentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minersentinel-backend
    restart: unless-stopped
    env_file: ".env"
    environment:
      DJANGO_SUPERUSER_USERNAME: ${DEFAULT_USERNAME:-satoshi}
      DJANGO_SUPERUSER_PASSWORD: ${DEFAULT_PASSWORD:-21millionBTC!}
      DJANGO_SUPERUSER_EMAIL: "${DEFAULT_EMAIL:-satoshi@example.com}"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minersentinel-network
    command: >
      sh -c "python manage.py migrate &&
              (python manage.py createsuperuser --no-input ||
              echo 'Superuser already exists or created — winning!') &&
              python manage.py runserver 0.0.0.0:8000"

  data-service:
    build:
      context: ./data-service
      dockerfile: Dockerfile
    container_name: minersentinel-data-service
    restart: unless-stopped
    env_file: ".env"
    environment:
      # Temperatur-Automatik: AC Infinity client and session of the backend
      ACINFINITY_DATA_DIR: /acinfinity_data
      ACINFINITY_MODULE_DIR: /backend_api
    volumes:
      - ./data-service:/app
      - ./backend/acinfinity_data:/acinfinity_data
      - ./backend/api:/backend_api:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minersentinel-network
    command: python app.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: minersentinel-web
    restart: unless-stopped
    env_file: ".env"
    ports:
      - "127.0.0.1:3080:80"
    depends_on:
      - backend
    networks:
      - minersentinel-network


networks:
  minersentinel-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
